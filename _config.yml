# Basic Information 
title: Junteng Liu
subtitle: First-year PhD candidate at HKUST NLP Group
description: Personal homepage of Junteng Liu, first-year PhD candidate at HKUST NLP Group. Research focuses on natural language processing and machine learning.
keywords: 'academic,personal website,Junteng Liu,NLP,machine learning'
canonical_url: https://laisanzz.github.io/LJT-Homepage
website_repository: https://github.com/laisanzz/LJT-Homepage

# Jekyll
markdown: kramdown

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji

# Front Matter Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
  - scope:
      path: ""
      type: publications
    values:
      layout: single
  - scope:
      path: ""
      type: talks
    values:
      layout: talk

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:name
  talks:
    output: true
    permalink: /:collection/:name

# Conversion
highlighter: rouge
excerpt_separator: "\n\n"
